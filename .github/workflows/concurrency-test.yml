name: Concurrency test

# Fans out N tile-processing matrix jobs on standard ubuntu-latest runners to
# measure how many actually execute at the same time.
#
# Each job runs scripts/process_tile.py over one 1-degree cell. The detection is
# not reimplemented: scripts/upstream_processing.py carries the real pipeline's
# calculate_runoff_onset and median_and_mad_with_min_obs, copied verbatim from
# egagli/global_snowmelt_runoff_onset, and the job builds a Sentinel-1
# RTC-shaped dataset (three relative orbits at the 12-day repeat, dual
# polarisation, three water years) and hands it to them. The backscatter is
# synthetic and generated locally, so no job depends on the Planetary Computer.
#
# The work is small on purpose -- about 0.25s of CPU per tile -- and the job
# paces its twelve units across hold_seconds so the runner is held for a known
# interval. What the probe needs is a controlled hold, not a busy CPU.
#
# The question is "how many runners does the account hand out at once", and
# occupancy alone cannot answer it: 11 runners busy with nothing waiting means
# the fan-out never asked for more, while 11 busy with 245 jobs queued is a
# hard ceiling. The report therefore pairs occupancy with queue depth over
# time, and says which of the two situations it observed.
#
# Three numbers come out of a run:
#   * in-job peak       - from timestamps recorded inside each job, this run
#                         only, so runner setup is excluded
#   * runner-level peak - from the Actions API, across every run whose jobs
#                         actually overlap this run's probe window
#   * peak queue depth  - jobs created but not yet on a runner, same window
#
# The census window bounds the experiment: jobs that finally get a runner after
# the window has closed exit immediately instead of holding one, so a low
# concurrency limit produces a fast answer instead of an hours-long run.

on:
  workflow_dispatch:
    inputs:
      job_count:
        description: "Matrix jobs to fan out (1-256, GitHub's per-run matrix cap)"
        required: false
        default: "256"
      hold_seconds:
        description: "Seconds each job holds its runner"
        required: false
        default: "180"
      census_minutes:
        description: "Minutes to keep holding runners before draining the queue"
        required: false
        default: "20"
      expected_limit:
        description: "Concurrency you expect, used only for the feasibility note"
        required: false
        default: "120"
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      job_count: ${{ steps.gen.outputs.job_count }}
      hold_seconds: ${{ steps.gen.outputs.hold_seconds }}
      deadline: ${{ steps.gen.outputs.deadline }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r scripts/requirements.txt

      - name: Test the tile processor
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Generate matrix
        id: gen
        env:
          # `inputs` is empty for push events, so fall back to a small smoke run.
          JOB_COUNT: ${{ inputs.job_count || '4' }}
          HOLD_SECONDS: ${{ inputs.hold_seconds || '30' }}
          CENSUS_MINUTES: ${{ inputs.census_minutes || '5' }}
          EXPECTED_LIMIT: ${{ inputs.expected_limit || '120' }}
        run: |
          set -euo pipefail

          for pair in "JOB_COUNT:$JOB_COUNT" "HOLD_SECONDS:$HOLD_SECONDS" \
                      "CENSUS_MINUTES:$CENSUS_MINUTES" "EXPECTED_LIMIT:$EXPECTED_LIMIT"; do
            name="${pair%%:*}"; value="${pair#*:}"
            case "$value" in
              ''|*[!0-9]*) echo "$name must be a non-negative integer, got '$value'" >&2; exit 1 ;;
            esac
          done

          # 256 is GitHub's hard cap on matrix jobs generated per workflow run.
          # To probe higher, dispatch several runs at once — the report job
          # aggregates across every run that overlaps this one's probe window.
          if [ "$JOB_COUNT" -lt 1 ] || [ "$JOB_COUNT" -gt 256 ]; then
            echo "job_count must be between 1 and 256, got $JOB_COUNT" >&2
            exit 1
          fi
          if [ "$CENSUS_MINUTES" -lt 1 ]; then
            echo "census_minutes must be at least 1, got $CENSUS_MINUTES" >&2
            exit 1
          fi
          if [ "$EXPECTED_LIMIT" -lt 1 ]; then
            echo "expected_limit must be at least 1, got $EXPECTED_LIMIT" >&2
            exit 1
          fi

          deadline=$(( $(date -u +%s) + CENSUS_MINUTES * 60 ))
          matrix="$(seq 1 "$JOB_COUNT" | jq -cs .)"

          {
            echo "matrix=$matrix"
            echo "job_count=$JOB_COUNT"
            echo "hold_seconds=$HOLD_SECONDS"
            echo "deadline=$deadline"
          } >> "$GITHUB_OUTPUT"

          echo "Fanning out $JOB_COUNT jobs; each holds a runner for ${HOLD_SECONDS}s."
          echo "Census window closes at $(date -u -d "@$deadline" +%Y-%m-%dT%H:%M:%SZ); jobs starting after that drain immediately."

          # Feasibility: how the three knobs interact, printed rather than
          # left for the reader to work out from a disappointing peak.
          window=$(( CENSUS_MINUTES * 60 ))
          clear=$(( JOB_COUNT * HOLD_SECONDS / EXPECTED_LIMIT ))
          echo "At $EXPECTED_LIMIT concurrent runners, ${JOB_COUNT}x${HOLD_SECONDS}s clears in ~${clear}s against a ${window}s window."
          if [ "$clear" -gt "$window" ]; then
            echo "::notice::The fan-out cannot clear inside the census window, so trailing jobs will drain without holding a runner. That is expected and is what bounds the run; the peak is still measured inside the window."
          fi
          if [ "$HOLD_SECONDS" -lt 60 ] && [ "$JOB_COUNT" -gt 8 ]; then
            echo "::warning::hold_seconds=$HOLD_SECONDS is short relative to runner startup (~15-30s, staggered across a large fan-out). The in-job peak will understate concurrency; prefer 120s or more."
          fi

  spin:
    name: "spin ${{ matrix.id }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed before the hold starts, so setup time is not charged to the
      # measured window. Occupancy is counted from job start either way.
      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r scripts/requirements.txt

      - name: Process tile and record the window
        env:
          TILE_ID: ${{ matrix.id }}
          HOLD_SECONDS: ${{ needs.prepare.outputs.hold_seconds }}
          DEADLINE: ${{ needs.prepare.outputs.deadline }}
        run: |
          python scripts/process_tile.py \
            --tile-id "$TILE_ID" \
            --hold-seconds "$HOLD_SECONDS" \
            --deadline "$DEADLINE" \
            --out results

      - name: Upload tile result and window
        uses: actions/upload-artifact@v4
        with:
          name: tile-${{ matrix.id }}
          path: results/
          retention-days: 1

  report:
    name: Concurrency report
    needs: [prepare, spin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download tile results
        uses: actions/download-artifact@v4
        with:
          pattern: tile-*
          path: results
          merge-multiple: true

      - name: In-job concurrency (this run)
        env:
          REQUESTED: ${{ needs.prepare.outputs.job_count }}
          HOLD_SECONDS: ${{ needs.prepare.outputs.hold_seconds }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, os, datetime

          requested = os.environ.get("REQUESTED") or "?"
          hold = os.environ.get("HOLD_SECONDS") or "?"

          held, drained = [], 0
          for path in sorted(glob.glob("results/**/job-*.txt", recursive=True)):
              with open(path) as fh:
                  for line in fh:
                      parts = line.split()
                      if len(parts) != 4:
                          continue
                      jid, start, end, was_held = parts
                      if was_held == "1":
                          held.append((int(start), int(end), jid))
                      else:
                          drained += 1

          print("## In-job concurrency (this run)\n")
          if not held:
              print("No job held a runner inside the census window.\n")
              raise SystemExit(0)

          # Sweep line over start/end events. Ends sort before starts at the same
          # second, so a runner freed and immediately reused is not double counted.
          events = []
          for start, end, _ in held:
              events.append((start, 1))
              events.append((end, -1))
          events.sort(key=lambda e: (e[0], e[1]))

          current = peak = 0
          peak_at = events[0][0]
          for ts, delta in events:
              current += delta
              if current > peak:
                  peak, peak_at = current, ts

          t0 = min(w[0] for w in held)
          t1 = max(w[1] for w in held)

          def iso(ts):
              return datetime.datetime.fromtimestamp(ts, datetime.timezone.utc).strftime("%H:%M:%SZ")

          print("| Metric | Value |")
          print("| --- | --- |")
          print(f"| Jobs requested | {requested} |")
          print(f"| Jobs that held a runner | {len(held)} |")
          print(f"| Jobs drained after the census window | {drained} |")
          print(f"| Hold time per job | {hold}s |")
          print(f"| **Peak in-job concurrency** | **{peak}** |")
          print(f"| Peak reached at | {iso(peak_at)} |")
          print(f"| First hold start | {iso(t0)} |")
          print(f"| Last hold end | {iso(t1)} |")
          print()
          print("Runner setup is excluded here, so this number runs a little below the")
          print("runner-level peak. Compare against the concurrency limit using the")
          print("runner-level section, which counts occupancy the way the limit does.\n")

          if peak < len(held):
              print(f"Peak ({peak}) is below the number of holding jobs ({len(held)}) — jobs queued waiting for a slot.\n")
          else:
              print(f"All {len(held)} holding jobs overlapped; the limit was not the binding constraint at this fan-out.\n")

          print("<details><summary>Timeline</summary>\n")
          print("```")
          span = max(t1 - t0, 1)
          width = 76
          for start, end, jid in sorted(held, key=lambda w: (w[0], int(w[2]))):
              lo = int((start - t0) / span * width)
              hi = max(int((end - t0) / span * width), lo + 1)
              print(f"{jid:>4} |{' ' * lo + '#' * (hi - lo):<{width}}| {end - start:>4}s")
          print("```")
          print("\n</details>")
          PY

      - name: Tile results
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, statistics

          tiles = []
          for path in sorted(glob.glob("results/**/tile-*.json", recursive=True)):
              with open(path) as fh:
                  try:
                      tiles.append(json.load(fh))
                  except json.JSONDecodeError:
                      pass

          print("## Tile results\n")
          if not tiles:
              print("No tile finished processing inside the census window.\n")
              raise SystemExit(0)

          onsets = [t["onset_doy_median"] for t in tiles if "onset_doy_median" in t]
          rmse = [t["rmse_days"] for t in tiles if "rmse_days" in t]
          px = sum(t["pixels_with_onset"] for t in tiles)

          print("Runoff onset from the pipeline's own calculate_runoff_onset: the seasonal")
          print("backscatter minimum per relative orbit and polarization, median across them,")
          print("then median across water years. Each tile also reports the error of that")
          print("estimate against the onset its synthetic input was built around.\n")
          print("| Metric | Value |")
          print("| --- | --- |")
          print(f"| Tiles processed | {len(tiles)} |")
          print(f"| Pixels with a detected onset | {px:,} |")
          if onsets:
              print(f"| Median onset across tiles | DOY {statistics.median(onsets):.0f} |")
              print(f"| Onset range across tiles | DOY {min(onsets):.0f} - {max(onsets):.0f} |")
          if rmse:
              print(f"| Detection RMSE (median / worst tile) | {statistics.median(rmse):.1f} / {max(rmse):.1f} days |")
          print()

          if onsets:
              print("<details><summary>Onset distribution across tiles</summary>\n")
              print("```")
              lo, hi = min(onsets), max(onsets)
              span = max(hi - lo, 1.0)
              bins = [0] * 12
              for o in onsets:
                  bins[min(int((o - lo) / span * 12), 11)] += 1
              scale = max(max(bins), 1)
              for i, n in enumerate(bins):
                  edge = lo + span * i / 12
                  print(f"DOY {edge:5.0f}  {n:4d}  {'#' * int(n * 40 / scale)}")
              print("```")
              print("\n</details>\n")
          PY

      - name: Runner-level concurrency and queue depth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import datetime, json, os, subprocess, sys, time

          repo = os.environ["REPO"]
          this_run = int(os.environ["THIS_RUN"])
          NOW = datetime.datetime.now(datetime.timezone.utc)
          # Only bounds how far back to page the runs list; whether a run counts
          # is decided per job by actual overlap with the probe window.
          LOOKBACK = datetime.timedelta(hours=6)
          # A job does not appear on its runner the instant it is created, and
          # that provisioning gap is not the account withholding capacity. Waits
          # at or below this count as provisioning, not queueing; counting them
          # made a 4-job smoke run where all four overlapped report a ceiling of
          # 3, because the last one was still booting through its first second.
          # Runner startup is documented at ~15-30s.
          QUEUE_GRACE = datetime.timedelta(seconds=30)

          def api_pages(path, key, stop_when=None):
              """Page through a list endpoint by hand.

              `gh api --paginate` concatenates JSON objects, which json.loads
              cannot read, and --slurp is too new to rely on across runner
              images. Walking pages explicitly avoids depending on either.
              `stop_when` ends paging early on a list the API returns
              newest-first, so a long repository history is not walked in full.
              """
              items, page = [], 1
              while True:
                  sep = "&" if "?" in path else "?"
                  url = f"{path}{sep}per_page=100&page={page}"
                  last = ""
                  for attempt in range(3):
                      proc = subprocess.run(
                          ["gh", "api", url], capture_output=True, text=True
                      )
                      if proc.returncode == 0:
                          break
                      last = proc.stderr.strip()
                      time.sleep(2 * (attempt + 1))
                  else:
                      raise RuntimeError(f"gh api {url} failed: {last}")
                  batch = json.loads(proc.stdout).get(key, [])
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  if stop_when and stop_when(batch[-1]):
                      return items
                  page += 1

          def parse(ts):
              if not ts:
                  return None
              return datetime.datetime.strptime(ts, "%Y-%m-%dT%H:%M:%SZ").replace(
                  tzinfo=datetime.timezone.utc
              )

          def occupancy(job):
              """(start, end) while the job held a runner, or None if it never did.

              A queued job is reported with started_at already set and equal to
              created_at, and that stale value survives if the job is later
              cancelled without ever running, so started_at cannot be trusted on
              its own. Steps are the honest signal: a job that never started has
              none, and for one that did, the first step's start to the last
              step's end is its occupancy. A job still *running* has steps with
              no completed_at, so its end is now rather than the end of whichever
              step happens to have finished — taking the latter would truncate
              every run still in flight alongside this one, which is exactly the
              case multi-run probing depends on.
              """
              if job.get("conclusion") == "skipped":
                  return None
              if job.get("status") not in ("in_progress", "completed"):
                  return None
              steps = job.get("steps") or []
              starts = [s for s in (parse(st.get("started_at")) for st in steps) if s]
              if not starts:
                  return None
              start = min(starts)
              if job.get("status") == "completed":
                  ends = [e for e in (parse(st.get("completed_at")) for st in steps) if e]
                  end = max(ends) if ends else parse(job.get("completed_at"))
              else:
                  end = NOW
              end = min(end or NOW, NOW)
              return (start, end) if end > start else None

          def clip(start, end, lo, hi):
              s, e = max(start, lo), min(end, hi)
              return (s, e) if e > s else None

          def peak_of(items):
              events = []
              for s, e in items:
                  events.append((s, 1))
                  events.append((e, -1))
              events.sort(key=lambda x: (x[0], x[1]))
              cur = top = 0
              at = events[0][0] if events else None
              for ts, d in events:
                  cur += d
                  if cur > top:
                      top, at = cur, ts
              return top, at

          def count_at(items, t):
              return sum(1 for s, e in items if s <= t < e)

          def paired_sweep(occ, q):
              """Peak occupancy, peak queue depth, and peak occupancy observed
              while at least one job was queued.

              That last number is the one that decides whether a peak is a
              ceiling. Keying the verdict on queue depth at the single instant
              occupancy peaked is fragile: the peak usually lands on the first
              rise, before anything has had a chance to queue behind it.
              """
              events = []
              for s, e in occ:
                  events.append((s, 0, 1))
                  events.append((e, 0, -1))
              for s, e in q:
                  events.append((s, 1, 1))
                  events.append((e, 1, -1))
              # Ends before starts at equal timestamps, so a runner freed and
              # immediately reused is not double counted.
              events.sort(key=lambda x: (x[0], x[2]))
              busy = waiting = 0
              peak_o = peak_w = saturated = 0
              peak_o_at = peak_w_at = saturated_at = None
              for ts, kind, delta in events:
                  if kind == 0:
                      busy += delta
                  else:
                      waiting += delta
                  if busy > peak_o:
                      peak_o, peak_o_at = busy, ts
                  if waiting > peak_w:
                      peak_w, peak_w_at = waiting, ts
                  if waiting > 0 and busy > saturated:
                      saturated, saturated_at = busy, ts
              return (peak_o, peak_o_at), (peak_w, peak_w_at), (saturated, saturated_at)

          # This run's own probe jobs define the window everything else is
          # measured against, so a peak that happened before this run started
          # cannot leak into the result.
          my_jobs = api_pages(
              f"/repos/{repo}/actions/runs/{this_run}/jobs?filter=latest", "jobs"
          )
          probe_windows = [
              w for w in (occupancy(j) for j in my_jobs if j["name"].startswith("spin")) if w
          ]

          runs = api_pages(
              f"/repos/{repo}/actions/runs",
              "workflow_runs",
              stop_when=lambda r: (parse(r.get("run_started_at")) or NOW) < NOW - LOOKBACK,
          )
          this = next((r for r in runs if r["id"] == this_run), None)

          print("## Runner-level concurrency and queue depth\n")
          if probe_windows:
              win_lo = min(s for s, _ in probe_windows)
              win_hi = max(e for _, e in probe_windows)
          elif this:
              # No probe job in this run ever held a runner (cancelled, or spin
              # never dispatched). Fall back to this run's own lifetime — never
              # to NOW, which would stretch the window across unrelated runs and
              # report their peak as if it were this one's.
              touched = parse(this.get("updated_at"))
              win_lo = parse(this["run_started_at"])
              win_hi = min(touched or NOW, NOW)
              if win_hi <= win_lo:
                  win_hi = win_lo + datetime.timedelta(seconds=1)
              print("No probe job in this run held a runner, so the window below is")
              print("this run's whole lifetime rather than a measured probe window.\n")
          else:
              print("Could not locate this run via the API.")
              raise SystemExit(0)

          occupied, queued, waits = [], [], []
          per_run, skipped = {}, []
          probe_counted = other_counted = never_ran = throttled = 0

          for run in runs:
              started = parse(run.get("run_started_at"))
              touched = parse(run.get("updated_at"))
              if started and started > win_hi:
                  continue  # began after the probe window closed
              if run.get("status") == "completed" and touched and touched < win_lo:
                  continue  # finished before it opened
              try:
                  jobs = api_pages(
                      f"/repos/{repo}/actions/runs/{run['id']}/jobs?filter=latest", "jobs"
                  )
              except RuntimeError as exc:
                  print(f"warning: could not read jobs for run {run['id']}: {exc}", file=sys.stderr)
                  skipped.append(run["id"])
                  continue
              for job in jobs:
                  created = parse(job.get("created_at"))
                  window = occupancy(job)

                  if window is None:
                      # Created but never on a runner: queue depth only. This is
                      # the signal that separates a ceiling from an under-request.
                      if created:
                          done = parse(job.get("completed_at")) if job.get("status") == "completed" else NOW
                          done = min(done or NOW, NOW)
                          if done - created > QUEUE_GRACE:
                              q = clip(created, done, win_lo, win_hi)
                              if q:
                                  queued.append(q)
                                  never_ran += 1
                      continue

                  start, end = window
                  if created and start > created:
                      waits.append((start - created).total_seconds())
                      if start - created > QUEUE_GRACE:
                          q = clip(created, start, win_lo, win_hi)
                          if q:
                              queued.append(q)
                              throttled += 1

                  held = clip(start, end, win_lo, win_hi)
                  if held is None:
                      continue
                  occupied.append(held)
                  per_run.setdefault(run["id"], []).append(held)
                  if job["name"].startswith("spin"):
                      probe_counted += 1
                  else:
                      other_counted += 1

          if not occupied:
              print("No job occupied a runner inside this run's probe window.")
              raise SystemExit(0)

          (peak_occ, peak_at), (peak_q, peak_q_at), (saturated, saturated_at) = paired_sweep(
              occupied, queued
          )
          q_at_peak = count_at(queued, peak_at)

          def hms(t):
              return t.strftime("%H:%M:%SZ")

          print("Occupied runners counted from the Actions API, first step start to")
          print("last step end, so runner setup is included — the same thing the")
          print("concurrency limit governs. Only jobs overlapping this run's probe")
          print("window are counted, and their windows are clipped to it.\n")
          print("| Metric | Value |")
          print("| --- | --- |")
          print(f"| Probe window | {hms(win_lo)} → {hms(win_hi)} ({int((win_hi - win_lo).total_seconds())}s) |")
          print(f"| Runs contributing jobs | {len(per_run)} |")
          print(f"| Jobs that occupied a runner | {len(occupied)} ({probe_counted} probe, {other_counted} other) |")
          print(f"| **Peak occupied runners** | **{peak_occ}** |")
          print(f"| Peak reached at | {hms(peak_at)} |")
          print(f"| Jobs queued at that instant | {q_at_peak} |")
          print(f"| Peak queue depth | {peak_q}{f' at {hms(peak_q_at)}' if peak_q_at else ''} |")
          print(f"| **Peak occupancy while jobs were queued** | **{saturated}** |")
          print(f"| Jobs created that never reached a runner | {never_ran} |")
          print(f"| Jobs that waited beyond provisioning ({int(QUEUE_GRACE.total_seconds())}s) | {throttled} |")
          if waits:
              waits.sort()
              p = lambda f: waits[min(int(len(waits) * f), len(waits) - 1)]
              print(f"| Queue wait median / p90 / max | {p(0.5):.0f}s / {p(0.9):.0f}s / {waits[-1]:.0f}s |")
          if skipped:
              print(f"| Runs skipped (unreadable) | {len(skipped)} |")
          print()

          # The whole point of the pairing: decide which of the two situations
          # produced this peak, rather than leaving it to the reader.
          if peak_q == 0:
              print(f"**This run does not bound the limit.** Nothing ever waited for a runner, so")
              print(f"the fan-out never demanded more than {peak_occ} at once. Raise job_count, raise")
              print("hold_seconds, or dispatch several runs together, then re-run.\n")
          elif saturated >= peak_occ:
              print(f"**{peak_occ} is a ceiling.** Jobs were queued while {peak_occ} runners were busy")
              print("(peak queue depth {q}), so the account had more work asked of it than it was".format(q=peak_q))
              print("willing to run. Compare this number against the configured limit.\n")
          else:
              print(f"**Ceiling looks like {saturated}, not {peak_occ}.** Occupancy touched {peak_occ}, but only")
              print(f"while the queue was empty; the most it reached with work waiting was {saturated}")
              print(f"at {hms(saturated_at)}. Treat {saturated} as the measured limit and re-run with a")
              print("longer hold_seconds to confirm.\n")

          print("<details><summary>Occupancy and queue depth over time</summary>\n")
          print("```")
          print(f"{'t+s':>6}  {'occupied':>8}  {'queued':>7}")
          span = max((win_hi - win_lo).total_seconds(), 1)
          samples = 24
          for i in range(samples + 1):
              offset = span * i / samples
              t = win_lo + datetime.timedelta(seconds=offset)
              print(f"{offset:6.0f}  {count_at(occupied, t):8d}  {count_at(queued, t):7d}")
          print("```")
          print("\n</details>\n")

          if len(per_run) > 1:
              print("| Run | Jobs | Peak within that run |")
              print("| --- | --- | --- |")
              for rid, items in sorted(per_run.items()):
                  top, _ = peak_of(items)
                  marker = " (this run)" if rid == this_run else ""
                  print(f"| [{rid}](https://github.com/{repo}/actions/runs/{rid}){marker} | {len(items)} | {top} |")
              print()
              print("A peak that matches the sum of the per-run peaks means the runs were not competing;")
              print("a peak well below that sum is the account-wide concurrency limit showing itself.\n")

          print("<details><summary>Caveats on this number</summary>\n")
          print("- API timestamps are whole seconds, and a runner freed and reused in the same")
          print("  second counts once, so the peak is a slight lower bound at slot handoff.")
          print(f"- A wait of {int(QUEUE_GRACE.total_seconds())}s or less counts as runner provisioning rather than")
          print("  queueing, so a job still booting is not counted as one being held back.")
          print("- `GITHUB_TOKEN` can only read this repository, but concurrency limits apply")
          print("  per account across all of them. Run this on an otherwise idle org.")
          print("\n</details>")
          PY
